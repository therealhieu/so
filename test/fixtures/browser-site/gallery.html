<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: 1rem; }
      .tiles svg { width: 100%; aspect-ratio: 1; border-radius: 12px; transition: transform 0.2s; }
      .tiles svg:hover { transform: rotate(-3deg) scale(1.05); }
    </style>
  </head>
  <body>
    <nav class="top">
      <strong>gallery</strong>
      <a href="index.html">← Showcase</a>
      <a href="index.html#forms">Showcase forms</a>
    </nav>
    <section>
      <h2>Generated tiles</h2>
      <p>Each tile is an SVG drawn by script. Press <kbd>H</kbd> to go back.</p>
      <div class="tiles" id="tiles"></div>
    </section>
    <script>
      const tiles = document.getElementById("tiles");
      for (let i = 0; i < 18; i++) {
        const h = (i * 37) % 360;
        const shapes = Array.from({ length: 5 }, (_, k) => {
          const r = 70 - k * 12;
          return `<circle cx="${50 + Math.cos(i + k) * 18}" cy="${50 + Math.sin(i * 2 + k) * 18}" r="${r / 2}" fill="hsl(${(h + k * 25) % 360} 70% ${40 + k * 8}%)" opacity="0.8"/>`;
        }).join("");
        tiles.insertAdjacentHTML(
          "beforeend",
          `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="hsl(${h} 30% 15%)"/>${shapes}</svg>`,
        );
      }
    </script>
  </body>
</html>
