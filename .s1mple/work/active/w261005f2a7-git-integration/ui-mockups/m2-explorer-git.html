<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>so · M2 Explorer Git markers</title>
<link rel="stylesheet" href="shared/terminal.css"><link rel="stylesheet" href="shared/git.css">
<script src="shared/term.js"></script><script src="shared/content.js"></script><script src="shared/git.js"></script></head>
<body><script>
(function () {
  const G = Mock.git;
  const focus = (a, sel) => { a.treeFocus = true; a.treeSel = sel; };
  G.mock({
    id: "W261005F2A7-M2", rev: "R2", title: "M2 · Explorer: Git markers", path: "m2-explorer-git.html",
    windowTitle: "so — ~/notes (git: main)",
    subtitle: "One-cell file markers for modified, staged, untracked, and conflicted files, plus folders that contain changes.",
    keys: [["j k", "move in the explorer"], ["Enter l", "open a file / fold projects/ideas"], ["Esc q", "back to the editor"], ["Ctrl-h", "focus the explorer from the editor"]],
    notes: "Markers: <b>M</b> modified · <b>S</b> staged · <b>?</b> untracked · <b>U</b> conflict · <b>•</b> folder contains changes. The explorer lists disk entries only, so a deleted tracked file has no row; its folders show <b>•</b>. One marker per row by precedence conflict &gt; deleted &gt; untracked &gt; modified &gt; staged. Each is a distinct glyph, so NO_COLOR keeps every state; colour only adds emphasis. The marker sits right after the name, following the unsaved <code>●</code>.",
    states: [
      { id: "S1", group: "Markers", label: "Every marker kind", caption: "The tree shows each state once: <code>2026-10-02.md S</code> staged, <code>so-roadmap.md M</code> modified, <code>ideas.md ?</code> and <code>kanban.md ?</code> untracked inside a new folder, <code>linh.md U</code> conflicted, and <code>•</code> on every folder that contains a change.", refs: "REQ4@R2 (explorer), DES10",
        apply: (a) => { focus(a, 4); } },
      { id: "S2", group: "Markers", label: "Collapsed new folder", caption: "With <code>projects/ideas</code> collapsed, its untracked files are hidden and the folder shows only <code>•</code>. Press Enter on it to expand: each file then shows its own <code>?</code> (per-file untracked, not one folder-level mark).", refs: "REQ4@R2 (untracked per file in new folders), RF9",
        apply: (a) => { a.ideasOpen = false; focus(a, 6); } },
      { id: "S3", group: "Markers", label: "Unsaved and modified", caption: "<code>so-roadmap.md ● M</code>: the dirty dot (unsaved in so) and the Git marker (differs from the index on disk) are separate facts and both show, dot first.", refs: "REQ4@R2, DES10",
        apply: (a) => { a.dirty = true; focus(a, 4); } },
      { id: "S4", group: "Markers", label: "Selected conflict row", caption: "The selection reverses the row (inverted in NO_COLOR); <code>U</code> stays readable inside it. Enter opens the file; stage is refused there (see M3 S11).", refs: "REQ1@R2 (conflict refusal), REQ4@R2",
        apply: (a) => { focus(a, 10); } },
      { id: "S5", group: "Markers", label: "Deleted tracked file", caption: "<code>daily/2026-10-03.md</code> is tracked but was deleted from disk. The explorer lists disk entries only, so the file has no row; <code>daily •</code> shows that the folder contains a change. lazygit (Space g g) shows and restores the deletion.", refs: "REQ4@R2 (deleted)",
        apply: (a) => { focus(a, 0); } },
      { id: "S6", group: "Responsive", label: "Narrow 80×24 (floating explorer)", caption: "At 80 columns the explorer floats over the editor (v1 rule). Markers render the same way inside the float.", refs: "REQ4@R2, v1 responsive rule",
        apply: (a) => { a.cols = 80; a.rows = 24; focus(a, 4); } },
      { id: "S7", group: "No repository", label: "Outside a repository", caption: "No markers: the tree matches v1.", refs: "REQ4@R2, DES10 invariant",
        apply: (a) => { a.repo = null; G.sync(a); focus(a, 4); } },
    ],
  });
})();
</script></body></html>
