name: release
# A pushed `v*` tag builds, smoke-tests, and publishes a release.
# A manual run is a dry run: the same build and smoke tests, nothing published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev+${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --os="*" --cpu="*"
      - env:
          V: ${{ steps.version.outputs.version }}
        run: |
          for t in darwin-arm64 darwin-x64; do bun build --compile --target=bun-$t --define "process.env.SO_VERSION=\"$V\"" src/app/main.ts src/workspace/index-worker.ts --outfile dist/so-$t; done
          for t in linux-x64 linux-arm64; do bun build --compile --target=bun-$t --define "process.env.SO_VERSION=\"$V\"" --define 'process.env.OPENTUI_LIBC="glibc"' src/app/main.ts src/workspace/index-worker.ts --outfile dist/so-$t; done
          (cd dist && sha256sum so-* > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - { os: macos-15, t: darwin-arm64 }
          - { os: macos-15-intel, t: darwin-x64 }
          - { os: ubuntu-24.04, t: linux-x64 }
          - { os: ubuntu-24.04-arm, t: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
      - env:
          V: ${{ needs.build.outputs.version }}
        run: chmod +x so-${{ matrix.t }} && test "$(./so-${{ matrix.t }} --version)" = "so $V"
  publish:
    needs: smoke
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
      - run: |
          flags=(--title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" so-* SHA256SUMS "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
