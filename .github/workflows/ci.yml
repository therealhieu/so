name: ci
on:
  pull_request:
    branches: [master]
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 — reads packageManager
      - run: bun install --frozen-lockfile
      # Poppler draws PDF pages; tests that need it skip without it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: bun run check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # Chrome's first launch on a fresh runner reads its files from a cold disk
      # and can outlast the 15 s start limit the real-Chrome test runs under.
      - if: runner.os == 'Linux'
        run: time google-chrome --headless=new --no-first-run --dump-dom about:blank > /dev/null
      - run: bun run test:ci
      # The compiled binary, as a release ships it, starts on this runner.
      - run: bun run build && dist/so --version
      - if: runner.os == 'Linux'
        run: bun run bench
