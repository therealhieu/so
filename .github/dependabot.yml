version: 2
# Each update is a PR; dependabot-auto-merge.yml merges it once the required
# checks pass. A week's cooldown skips releases that get pulled soon after.
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Keeps the exact pins package.json holds.
    versioning-strategy: increase
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Its patch under patches/ is keyed to the installed version.
      - dependency-name: beautiful-mermaid
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]
      prod:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
